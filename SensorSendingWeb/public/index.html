<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>モグラたたき コントローラー</title><link rel="stylesheet" href="/controller.css"></head>
<body><main>
<header><span>AR WHACK-A-MOLE</span><span id="connection" role="status">未接続</span></header>
<div class="team-mark" id="teamMark" aria-hidden="true">R</div><h1 id="teamTitle">赤チーム</h1>
<p class="lead" id="guide">スマホを普段の持ち方で握って、<br>送信を開始してください。</p>
<div id="secureNotice" class="notice" hidden>実センサーにはHTTPS接続が必要です。PCのQRコードから開いてください。</div>
<button id="start" class="primary">センサーを許可して送信</button><button id="microphone" hidden>おねむ用のマイクを許可</button>
<p id="message" class="message" role="status" aria-live="polite"></p>
<div class="ready" id="ready" hidden><span class="ready-dot"></span><strong>送信中</strong><p>この画面を開いたまま、<br>Unityの画面を見て遊ぼう。</p></div>
<details id="settings"><summary>接続設定・停止</summary><div class="settings">
<label for="room">ルーム</label><input id="room" autocomplete="off" spellcheck="false" maxlength="64">
<label for="player">チーム</label><select id="player"><option value="red">赤チーム</option><option value="blue">青チーム</option></select>
<button id="stop" disabled>送信を停止</button><a id="diagnostics" href="/diagnostics">センサーの診断画面</a>
</div></details><footer>振る・傾ける・声で操作。指示はUnityに表示されます。</footer>
</main><script type="module" src="/controller.js"></script></body></html>
