<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sensor Bridge · PCモニター</title><link rel="stylesheet" href="/style.css"></head><body><main>
<header><div class="logo">AR LAB / SENSOR BRIDGE</div><span id="connection" class="pill" role="status">未接続</span></header>
<div class="intro"><div class="sub">2台のスマホから、ひとつのフィールドへ。</div><h1>センサーを見てみよう。</h1><p>赤・青の入力を確認して、そのままUnityへ接続。まずはここでセンサーの動作としきい値をチェックできます。</p></div>
<section class="card"><h2>ルームを共有</h2><label for="room">Unityにもこのルームキーを入力してください（このキーを知る端末が参加できます）</label><input id="room" class="room" minlength="16" maxlength="64"><div class="actions"><button id="connect" class="primary">このルームに接続</button><button id="copy">キーをコピー</button><button id="newRoom">新しいルーム</button></div><label for="baseUrl" class="telemetry">スマホ用HTTPS URL（npm run shareで表示されるURL）</label><input id="baseUrl" type="url" placeholder="https://….trycloudflare.com"><div class="actions"><button id="qrUpdate">QRコードを更新</button></div><div id="message" class="status" role="status"></div><div id="httpsNotice" class="notice">localhostのQRコードはスマホでは開けません。HTTPS URLを入力すると、赤・青それぞれの接続用QRコードを生成します。</div><div id="qrGrid" class="qr-grid" hidden></div></section>
<div class="grid telemetry" id="players"></div><div class="foot">受信が2秒以上途絶えた場合は古い値を非表示にします。シミュレーターの入力は「合成データ」と表示します。</div>
</main><script type="module" src="/monitor.js"></script></body></html>
